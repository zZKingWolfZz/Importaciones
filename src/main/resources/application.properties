# Configuración de Servidor Spring Boot
server.port=8080
server.servlet.context-path=/

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/superhuancayo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fleetuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tu_password_postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Seguridad JWT
app.jwt.secret=${APP_JWT_SECRET:CambiaEstaClaveSecretaDeMinimo32Caracteres2026}
app.jwt.expiration-ms=86400000

# Codificación y Formato
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Aplicación
spring.application.name=importaciones-super-huancayo
spring.main.banner-mode=console

# Logging
logging.level.pe.edu.utp.superhuancayo=INFO
logging.level.org.springframework.web=INFO
